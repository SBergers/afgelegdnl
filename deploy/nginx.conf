server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # interne mappen niet tonen
  location ~ /\.(git|github) { deny all; return 404; }
  location ^~ /deploy/ { deny all; return 404; }

  location ~* \.(jpg|jpeg|png|svg|webp)$ { expires 7d; add_header Cache-Control "public"; }
  location ~* \.(js|css|html)$ { expires 5m; }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
}
