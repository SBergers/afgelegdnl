# afgelegd.nl — plak deze twee services onder "services:" in je bestaande docker-compose.yml.
# Pas eventueel /volume1/docker/afgelegd aan naar waar jij je docker-mappen hebt.
# De site draait op poort 8095 (8080 is al bezet door SABnzbd).

  afgelegd-sync:
    image: alpine/git:latest
    container_name: afgelegd-sync
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        git config --global --add safe.directory /site
        if [ ! -d /site/.git ]; then git clone https://github.com/SBergers/afgelegdnl.git /site; fi
        while true; do
          git -C /site fetch -q origin && git -C /site reset -q --hard origin/main
          sleep 60
        done
    volumes:
      - /volume1/docker/afgelegd/site:/site

  afgelegd-web:
    image: nginx:alpine
    container_name: afgelegd-web
    restart: unless-stopped
    ports:
      - "8095:80"
    volumes:
      - /volume1/docker/afgelegd/site:/usr/share/nginx/html:ro
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'CONF'
        server {
          listen 80;
          root /usr/share/nginx/html;
          index index.html;
          location ~ /\.git { return 404; }
          location ^~ /deploy/ { return 404; }
          location ~* \.(jpg|jpeg|png|svg|webp)$ { expires 7d; }
          location ~* \.(js|css|html)$ { expires 5m; }
          gzip on;
          gzip_types text/css application/javascript image/svg+xml;
        }
        CONF
        exec nginx -g 'daemon off;'
