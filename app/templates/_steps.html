<ol class="steps{% if o.status == CANCELLED %} off{% endif %}" style="--n:{{ flow|length }}" aria-label="{{ _('Status van je bestelling') }}">
{% for k, label in flow %}<li class="{% if loop.index0 < step or (k == 'afgerond' and loop.index0 == step) %}done{% elif loop.index0 == step %}now{% endif %}"{% if loop.index0 == step %} aria-current="step"{% endif %}>{{ _(label) }}</li>
{% endfor %}</ol>
